      <stop offset="0%" stop-color="#2A1E31" />
      <stop offset="100%" stop-color="#120E16" />
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EBD9A8" />
      <stop offset="100%" stop-color="#D9AA3F" />
