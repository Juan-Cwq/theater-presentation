    <circle cx="300" cy="90" r="7" opacity="0.5" />
    <circle cx="360" cy="90" r="7" opacity="0.9" />
    <circle cx="840" cy="90" r="7" opacity="0.5" />
    <circle cx="900" cy="90" r="7" opacity="0.9" />
    <circle cx="960" cy="90" r="7" opacity="0.5" />
    <circle cx="1020" cy="90" r="7" opacity="0.9" />
    <circle cx="1080" cy="90" r="7" opacity="0.5" />
  </g>

  <text x="600" y="150" text-anchor="middle" fill="#D9AA3F"
